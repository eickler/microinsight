name: Publish packaged chart to chart repository

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: Azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          # Strip the leading "v" of the tag so that the published chart version
          # is plain SemVer and matches charts/Chart.yaml.
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(helm show chart charts | awk '/^version:/ {print $2}')
          if [ "$VERSION" != "$CHART_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME implies chart version $VERSION," \
                 "but charts/Chart.yaml declares $CHART_VERSION." \
                 "Chart.yaml is the version consumers read, so refusing to publish."
            exit 1
          fi
          echo "Packaging Helm chart version $VERSION"
          helm package charts --destination .

      - name: Checkout "charts" repository
        uses: actions/checkout@v4
        with:
          repository: eickler/charts
          token: ${{ secrets.CHARTS_TOKEN }}
          path: charts-repo

      - name: Copy Helm chart to "charts" repository
        run: |
          cp *.tgz charts-repo/

      - name: Update Helm repo index
        run: |
          cd charts-repo
          helm repo index .

      - name: Push changes
        run: |
          cd charts-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update Helm chart"
          git push
